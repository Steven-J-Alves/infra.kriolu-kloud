services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: gitlab.kriolu-kloud.cv
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.kriolu-kloud.cv'
        gitlab_rails['time_zone'] = 'Atlantic/Cape_Verde'
        gitlab_rails['gitlab_email_from'] = 'noreply@kriolu-kloud.cv'
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = 'mail.kriolu-kloud.cv'
        gitlab_rails['smtp_port'] = 25
        gitlab_rails['smtp_domain'] = 'kriolu-kloud.cv'
        gitlab_rails['smtp_authentication'] = 'none'
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['smtp_openssl_verify_mode'] = 'none'
        gitlab_rails['gitlab_email_reply_to'] = 'noreply@kriolu-kloud.cv'
        gitlab_rails['gitlab_email_display_name'] = 'KrioluKloud Git'

        # TLS é tratado pelo Traefik. GitLab serve só HTTP internamente.
        letsencrypt['enable'] = false
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = {
          "Host" => "gitlab.kriolu-kloud.cv",
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on",
          "X-Real-IP" => "$$remote_addr",
          "X-Forwarded-For" => "$$proxy_add_x_forwarded_for"
        }
        # Traefik que vai do utilizador-final via HTTPS é confiável.
        gitlab_rails['trusted_proxies'] = ['172.16.0.0/12', '10.0.0.0/8', '192.168.0.0/16']

        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        sidekiq['max_concurrency'] = 10
        postgresql['shared_buffers'] = "256MB"
        postgresql['max_connections'] = 100
        prometheus_monitoring['enable'] = false
        gitlab_rails['registry_enabled'] = false
        alertmanager['enable'] = false

        gitlab_rails['backup_keep_time'] = 604800
        gitlab_rails['backup_path'] = "/var/opt/gitlab/backups"
    ports:
      # HTTP/HTTPS NÃO são publicados — Traefik chega via rede `traefik-public`.
      - '22:22'
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # Router HTTPS (websecure :443)
      - "traefik.http.routers.gitlab.rule=Host(`gitlab.kriolu-kloud.cv`)"
      - "traefik.http.routers.gitlab.entrypoints=websecure"
      - "traefik.http.routers.gitlab.tls=true"
      - "traefik.http.routers.gitlab.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gitlab.service=gitlab"
      # Router HTTP (web :80) → redirect para HTTPS
      - "traefik.http.routers.gitlab-http.rule=Host(`gitlab.kriolu-kloud.cv`)"
      - "traefik.http.routers.gitlab-http.entrypoints=web"
      - "traefik.http.routers.gitlab-http.middlewares=gitlab-redirect"
      - "traefik.http.middlewares.gitlab-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.gitlab-redirect.redirectscheme.permanent=true"
      # Onde o Traefik faz proxy
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
    volumes:
      - ./data/config:/etc/gitlab
      - ./data/logs:/var/log/gitlab
      - ./data/data:/var/opt/gitlab
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/-/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 600s

networks:
  traefik-public:
    external: true
